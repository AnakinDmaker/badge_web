<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">
        <title>Badge Controller</title>
        <link rel="stylesheet" href="css/style.css">
    
    </head>

    <body>

        <h2>Badge Controller</h2>
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
        <p id="connectionStatus">Not connected</p>

        <h3>Effect</h3>
        <button class="effectBtn" data-effect="Steady" disabled>Steady</button>
        <button class="effectBtn" data-effect="Wave" disabled>Wave</button>
        <button class="effectBtn" data-effect="Pulse" disabled>Pulse</button>

        <h3>Brightness</h3>
        <input type="range" id="brightnessSlider" min="0" max="255" value="255" disabled>
        <span id="brightnessValue">255</span>

        <h3>LED Preview (simulated)</h3>
        <div id="ledPreview" style="display: flex; gap: 4px; flex-wrap: wrap; max-width: 300px;"></div>

        <h3>Status</h3>
        <pre id="output">-</pre>

        <script src="js/main.js"></script>
        
    </body>

</html>
